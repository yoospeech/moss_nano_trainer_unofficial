moss_nano:
  sampling_rate: 16000
  channels: 2
  frame_rate: 12.5
  num_quantizers: 16
  commitment: 0.25
  codebook_weight: 1.0
  quantizer_dropout: 1.0
  # Normalize projected latents AND code vectors for VQ loss, STE and decoding.
  l2_normalize: true

mpd:
  periods: [2, 3, 5, 7, 11]
  max_downsample_channels: 512
  channels: 16
  channel_increasing_factor: 4

mstft:
  stft_params:
    fft_sizes: [128, 256, 512, 1024, 2048]
    hop_sizes: [32, 64, 128, 256, 512]
    win_lengths: [128, 256, 512, 1024, 2048]
    window: hann_window
  in_channels: 1
  out_channels: 1
  kernel_sizes: [5, 3]
  channels: 32
  max_downsample_channels: 512
  downsample_scales: [2, 2, 2]
  use_weight_norm: true
